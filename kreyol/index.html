function translateFrame(){
 const f=document.getElementById('site');
 try{
  const d=f.contentDocument;
  if(!d||!d.body)return;
  const walk=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);
  for(const n of nodes){const t=n.nodeValue.trim();if(translations[t])n.nodeValue=n.nodeValue.replace(t,translations[t]);}
  for(const el of d.querySelectorAll('input,textarea,option,button,[aria-label],[placeholder]')){
   for(const a of ['placeholder','aria-label','title','value']){
    if(el.hasAttribute(a)){const v=el.getAttribute(a);if(translations[v])el.setAttribute(a,translations[v]);}
   }
   if(el.tagName==='INPUT'&&el.placeholder&&translations[el.placeholder])el.placeholder=translations[el.placeholder];
  }
  d.documentElement.lang='ht';
  document.getElementById('site').style.height=Math.max(d.body.scrollHeight,d.documentElement.scrollHeight)+'px';
 }catch(e){}
}
document.getElementById('site').addEventListener('load',()=>{translateFrame();setInterval(translateFrame,1500);});
</script>
